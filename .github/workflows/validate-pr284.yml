name: Validate Sellbird PR 284 (isolated)
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact fork commit SHA to validate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sellbird-pr284-${{ inputs.commit_sha }}
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.repository == 'silvercharm-pl/sellbird' && inputs.commit_sha == '781239756eb1ac601ad6174606a1cf6ee1f3559a' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact reviewed commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "781239756eb1ac601ad6174606a1cf6ee1f3559a"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: python -m pip install -e ".[dev]" "setuptools>=68" wheel
      - name: Unit, integration, end-to-end and soak tests
        run: python -m pytest -q
      - name: Installed wheel scripted Codex CLI
        if: runner.os != 'Windows'
        env:
          SELLBIRD_PACKAGE_TESTS: '1'
        run: python -m pytest -q tests/test_packaging.py
      - name: Real Codex CLI against localhost mocks
        if: runner.os != 'Windows'
        env:
          SELLBIRD_CODEX_CLI_TESTS: '1'
        run: |
          npm install -g @openai/codex@0.159.3
          python -m pytest -q tests/test_codex_cli_surface.py